    "bohr_model_3d.html": "玻尔原子模型 · 三维电子运动"

    "index": "index.html",
    "cathode": "cathode_ray.html",
    "field": "electron_in_field.html",
    "alpha": "alpha_scattering.html",
    "model": "atomic_model.html",

<script>
(function () {
    'use strict';

    var frame = document.getElementById('frame');
    var boot = document.getElementById('boot');
    var cache = {};          /* 解码缓存：同一页来回切换不必重复解码 */
    var current = '';
    var firstLoad = true;

    function toUtf8(b64) {
        var bin = atob(b64);
        var i;
        if (window.TextDecoder) {
            var u8 = new Uint8Array(bin.length);
            for (i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
            return new TextDecoder('utf-8').decode(u8);
        }
        return decodeURIComponent(escape(bin));
    }

    function htmlOf(name) {
        if (!cache[name]) cache[name] = toUtf8(PAGES_B64[name]);
        return cache[name];
    }

    /* 把 #alpha / #alpha_scattering.html / atomic_model.html?element=Au 拆成 {name, q} */
    function parse(raw) {
        var s = String(raw || '').replace(/^#/, '');
        var q = '';
        var qi = s.indexOf('?');
        if (qi >= 0) { q = s.slice(qi + 1); s = s.slice(0, qi); }
        s = s.replace(/#.*$/, '');
        var parts = s.split('/');
        s = parts[parts.length - 1] || '';
        if (PAGES_ALIAS[s]) s = PAGES_ALIAS[s];
        if (!PAGES_B64[s]) s = '';
        return { name: s, q: q };
    }

    function keyOf(o) {
        return o.name ? o.name + (o.q ? '?' + o.q : '') : '';
    }

    /* atomic_model / bohr_model_3d 两页靠 location.search 读 ?element=Au 来决定
       初始元素。srcdoc 里的 location.search 恒为空，所以把源码中那处
       location.search 换成一个字符串字面量再塞进去 —— 只做一次字符串替换，
       距离换来的是「α 页点金核 → 打开的就是金原子」这条教学动线不断。 */
    function htmlFor(name, q) {
        var html = htmlOf(name);
        if (q && /(^|&)element=[A-Za-z]{1,2}(&|$)/.test(q)) {
            html = html.replace(/location\.search/g, JSON.stringify('?' + q));
        }
        return html;
    }

    function show(raw) {
        var o = parse(raw);
        var name = o.name || 'index.html';
        var key = keyOf({ name: name, q: o.q });
        current = key;
        frame.srcdoc = htmlFor(name, o.q);
        document.title = PAGES_TITLE[name] || '原子结构模拟';
        try {
            if (location.hash !== '#' + key) {
                history.replaceState(null, '', '#' + key);
            }
        } catch (e) {}
    }

    frame.addEventListener('load', function () {
        if (firstLoad) {
            firstLoad = false;
            boot.className = 'gone';
        }
    });

    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.t !== 'atom-nav') return;
        var o = parse(d.p);
        if (!o.name) return;
        if (d.q) o.q = String(d.q);
        var key = keyOf(o);
        if (key && key !== current) show(key);
    });

    window.addEventListener('hashchange', function () {
        var key = keyOf(parse(location.hash));
        if (key && key !== current) show(key);
    });

    /* 给外部（探针 / 调试）留一个口子 */
    window.__ATOM_SHELL__ = {
        show: show,
        pages: Object.keys(PAGES_B64),
        current: function () { return current; }
    };

    show(location.hash || 'index.html');
})();
</script>
