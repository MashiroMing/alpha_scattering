    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // 元素数据：前 36 号元素 + 拓展（金）
        // · neutrons 取「该元素最常见核素」的中子数（Fe → ⁵⁶Fe、Cu → ⁶³Cu、Ni → ⁵⁸Ni），
        //   所以每条数据都对应真实存在的原子；氢的中子数为 0，正好呼应"氕没有中子"
        // · electrons 是基态原子的真实电子层排布（K/L/M/N… 逐层展开），不是初中简化规律：
        //   21~36 号是过渡元素，M 层会出现 9~16 个电子（如 Fe 的 2,8,14,2），这是真实的 3d 填充结果
        // · 质量数 A = 质子数 + 中子数，由两个字段相加得出，不单独存储
        const elements = {
            // 第 1 周期
            'H':  {name: '氢', protons: 1,  neutrons: 0,  electrons: [1],    symbol: 'H'},
            'He': {name: '氦', protons: 2,  neutrons: 2,  electrons: [2],    symbol: 'He'},
            // 第 2 周期
            'Li': {name: '锂', protons: 3,  neutrons: 4,  electrons: [2, 1], symbol: 'Li'},
            'Be': {name: '铍', protons: 4,  neutrons: 5,  electrons: [2, 2], symbol: 'Be'},
            'B':  {name: '硼', protons: 5,  neutrons: 6,  electrons: [2, 3], symbol: 'B'},
            'C':  {name: '碳', protons: 6,  neutrons: 6,  electrons: [2, 4], symbol: 'C'},
            'N':  {name: '氮', protons: 7,  neutrons: 7,  electrons: [2, 5], symbol: 'N'},
            'O':  {name: '氧', protons: 8,  neutrons: 8,  electrons: [2, 6], symbol: 'O'},
            'F':  {name: '氟', protons: 9,  neutrons: 10, electrons: [2, 7], symbol: 'F'},
            'Ne': {name: '氖', protons: 10, neutrons: 10, electrons: [2, 8], symbol: 'Ne'},
            // 第 3 周期
            'Na': {name: '钠', protons: 11, neutrons: 12, electrons: [2, 8, 1], symbol: 'Na'},
            'Mg': {name: '镁', protons: 12, neutrons: 12, electrons: [2, 8, 2], symbol: 'Mg'},
            'Al': {name: '铝', protons: 13, neutrons: 14, electrons: [2, 8, 3], symbol: 'Al'},
            'Si': {name: '硅', protons: 14, neutrons: 14, electrons: [2, 8, 4], symbol: 'Si'},
            'P':  {name: '磷', protons: 15, neutrons: 16, electrons: [2, 8, 5], symbol: 'P'},
            'S':  {name: '硫', protons: 16, neutrons: 16, electrons: [2, 8, 6], symbol: 'S'},
            'Cl': {name: '氯', protons: 17, neutrons: 18, electrons: [2, 8, 7], symbol: 'Cl'},
            'Ar': {name: '氩', protons: 18, neutrons: 22, electrons: [2, 8, 8], symbol: 'Ar'},
            // 第 4 周期（21~36 号为过渡元素，M 层电子数会超过 8）
            'K':  {name: '钾', protons: 19, neutrons: 20, electrons: [2, 8, 8, 1],  symbol: 'K'},
            'Ca': {name: '钙', protons: 20, neutrons: 20, electrons: [2, 8, 8, 2],  symbol: 'Ca'},
            'Sc': {name: '钪', protons: 21, neutrons: 24, electrons: [2, 8, 9, 2],  symbol: 'Sc'},
            'Ti': {name: '钛', protons: 22, neutrons: 26, electrons: [2, 8, 10, 2], symbol: 'Ti'},
            'V':  {name: '钒', protons: 23, neutrons: 28, electrons: [2, 8, 11, 2], symbol: 'V'},
            'Cr': {name: '铬', protons: 24, neutrons: 28, electrons: [2, 8, 13, 1], symbol: 'Cr'},
            'Mn': {name: '锰', protons: 25, neutrons: 30, electrons: [2, 8, 13, 2], symbol: 'Mn'},
            'Fe': {name: '铁', protons: 26, neutrons: 30, electrons: [2, 8, 14, 2], symbol: 'Fe'},
            'Co': {name: '钴', protons: 27, neutrons: 32, electrons: [2, 8, 15, 2], symbol: 'Co'},
            'Ni': {name: '镍', protons: 28, neutrons: 30, electrons: [2, 8, 16, 2], symbol: 'Ni'},
            'Cu': {name: '铜', protons: 29, neutrons: 34, electrons: [2, 8, 18, 1], symbol: 'Cu'},
            'Zn': {name: '锌', protons: 30, neutrons: 34, electrons: [2, 8, 18, 2], symbol: 'Zn'},
            'Ga': {name: '镓', protons: 31, neutrons: 38, electrons: [2, 8, 18, 3], symbol: 'Ga'},
            'Ge': {name: '锗', protons: 32, neutrons: 42, electrons: [2, 8, 18, 4], symbol: 'Ge'},
            'As': {name: '砷', protons: 33, neutrons: 42, electrons: [2, 8, 18, 5], symbol: 'As'},
            'Se': {name: '硒', protons: 34, neutrons: 46, electrons: [2, 8, 18, 6], symbol: 'Se'},
            'Br': {name: '溴', protons: 35, neutrons: 44, electrons: [2, 8, 18, 7], symbol: 'Br'},
            'Kr': {name: '氪', protons: 36, neutrons: 48, electrons: [2, 8, 18, 8], symbol: 'Kr'},
            // 拓展：金（Z=79）
            // 真实电子排布 2, 8, 18, 32, 18, 1，共 6 层（K~P），来源 [Xe]4f¹⁴5d¹⁰6s¹
            // 它依然遵守初中那条规律：最外层（第 6 层）只有 1 个电子，不超过 8 个
            'Au': {name: '金', protons: 79, neutrons: 118, electrons: [2, 8, 18, 32, 18, 1], symbol: 'Au'}
        };

        // === 核内质子 / 中子 ===
        // 原子核不再是"一个带电的圆"，而是逐颗画出核子：红=质子、灰=中子。
        // 【为什么需要自适应？】核半径 ∝ √核子数：金 197 个核子 → 半径 56px，
        // 而氢只有 1 个核子，按基准尺寸画出来半径只有 3.4px（直径 6.8px），投影上几乎看不见。
        // 处理办法：核半径不足 NUCLEUS_R_MIN 的元素，整颗核连核子一起等比放大
        // —— 堆积方式不变，只保住"看得清"的下限；核子数 ≥ 12 后自动回到基准尺寸。
        const NUCLEON_R = 3.4;                        // 单个核子的基准绘制半径（金所用尺寸）
        const NUCLEON_SPACING = NUCLEON_R * 2.16;     // 六方堆积的中心间距（比 2R 略大，留白避免糊成一坨）
        const NUCLEUS_R_MIN = 14;                     // 核半径下限（直径 28px）
        const NUCLEON_P_COLOR = '#FF6B6B';            // 质子（红）
        const NUCLEON_N_COLOR = '#8E9BAA';            // 中子（灰）

        // 六方紧密堆积：先铺一张比目标更大的六方点阵，再取离核心最近的 total 个点
        // → 自然形成一个圆形核（这正是真实原子核的堆积方式）
        function buildNucleons(total, protonCount) {
            const pts = [];
            const rowH = NUCLEON_SPACING * Math.sqrt(3) / 2;    // 行距 = 间距 × √3/2
            const rows = Math.ceil(Math.sqrt(total)) + 4;       // 铺得比目标略大，再裁剪
            for (let row = -rows; row <= rows; row++) {
                const y = row * rowH;
                const xOff = (row % 2) ? NUCLEON_SPACING / 2 : 0;   // 奇数行错开半格
                for (let col = -rows; col <= rows; col++) {
                    const x = col * NUCLEON_SPACING + xOff;
                    pts.push({x: x, y: y, d: x * x + y * y});
                }
            }
            pts.sort((a, b) => a.d - b.d);
            const chosen = pts.slice(0, total);

            // 先按基准尺寸算出这颗核的半径，再决定整体放大倍数（小核放大，大核不动）
            const baseR = Math.sqrt(chosen[chosen.length - 1].d) + NUCLEON_R;
            const scale = Math.max(1, NUCLEUS_R_MIN / baseR);

            // 质子/中子怎么分配：给每个位置算一个确定性哈希分数，取分数最小的 protonCount 个作质子。
            // 为什么不用"按比例交替"（i×质子数 mod 总数 < 质子数）？当核子数与质子数不互质时会出规则条纹，
            // 例如氪 36/84（gcd=12）会形成周期性格子。哈希打分既保证数量精确，分布也自然。
            const score = i => {
                const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
                return x - Math.floor(x);
            };
            const order = chosen.map((_, i) => i).sort((a, b) => score(a) - score(b));
            order.slice(0, protonCount).forEach(i => { chosen[i].type = 'p'; });
            chosen.forEach(p => { if (!p.type) p.type = 'n'; });

            // 位置与核子半径一起放大，堆积密度保持不变
            chosen.forEach(p => { p.x *= scale; p.y *= scale; });

            return {
                nucleons: chosen,
                radius: baseR * scale,          // 核半径
                nucleonR: NUCLEON_R * scale     // 单颗核子的绘制半径
            };
        }

        // 当前元素的核子结构（惰性构建 + 缓存，只在切换元素时重算）
        let nucleusBuild = null;
        function getNucleus(element) {
            if (!nucleusBuild || nucleusBuild.symbol !== element.symbol) {
                // 核子总数 = 质子数 + 中子数；其中质子数个画成质子
                nucleusBuild = buildNucleons(
                    element.protons + element.neutrons,
                    element.protons
                );
                nucleusBuild.symbol = element.symbol;
            }
            return nucleusBuild;
        }

        // 电子层名称：K、L、M、N、O、P、Q（金用到前 6 个）
        const SHELL_NAMES = ['K层', 'L层', 'M层', 'N层', 'O层', 'P层', 'Q层'];

        // 电子层半径：基础 60px、层间距最大 50px。
        // 【为什么要压缩？】原来写死 `60 + shellIndex * 50`，6 层的金最外层要到 310px，
        // 超出画布半径 —— 第 6 层会被直接裁掉。
        // 现在按层数自适应：≤4 层时 step 仍为 50（H~O 的视觉完全不变），
        // 5 层以上自动收窄，保证最外层不超过 SHELL_MAX_R（底部要留给元素符号）。
        // 另外第 1 层半径可传 base：金原子的核展开后有 57px 大，K 层必须从更远处起步才不会穿过核
        const SHELL_BASE = 60;                              // 第 1 层半径（H~O）
        const SHELL_STEP_MAX = 50;                          // 层间距上限
        const SHELL_MAX_R = canvas.height / 2 - 100;        // 750 画布 → 275：最外层半径上限
        function shellRadius(shellIndex, shellCount, base) {
            const b = base || SHELL_BASE;
            if (shellCount <= 1) return b;
            const step = Math.min(SHELL_STEP_MAX, (SHELL_MAX_R - b) / (shellCount - 1));
            return b + shellIndex * step;
        }

        let currentElement = 'Li';
        let electronAngles = [];
        let time = 0;

        // 初始化电子角度
        function initElectrons() {
            electronAngles = [];
            const element = elements[currentElement];
            element.electrons.forEach((count, shellIndex) => {
                for (let i = 0; i < count; i++) {
                    electronAngles.push({
                        shell: shellIndex,
                        angle: (Math.PI * 2 / count) * i,
                        // 外层电子运动稍慢：0.015 / (1 + 0.25n)
                        // 前两层与原式 0.015 - 0.003n 完全一致（K=0.015、L=0.012），
                        // 但外层永不归零 —— 原式在 6 层时最外层速度会算成 0，电子直接卡死
                        speed: 0.015 / (1 + shellIndex * 0.25)
                    });
                }
            });
        }

        // 绘制原子
        function drawAtom() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const element = elements[currentElement];
            // 所有元素都展开核内结构：核子逐颗绘制
            const nucBuild = getNucleus(element);
            const nucleusR = nucBuild.radius;
            // K 层起点：核小的元素保持原来的 60px（H~Ne 视觉不变）；
            // 核大到 60px 起点会穿过核的元素（金），自动外推到核半径 + 20
            const shellBase = Math.max(SHELL_BASE, nucleusR + 20);

            // 绘制背景星光
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 1;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.3})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 绘制原子核外层光晕（半径随核大小走）
            // 核内结构展开后把光晕收窄减弱：原来 0.4 的大面积红光会把核子的红灰色差整个糊掉
            const glowR = nucleusR * 2.2;
            const nucleusGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowR);
            nucleusGradient.addColorStop(0, 'rgba(255, 107, 107, 0.22)');
            nucleusGradient.addColorStop(1, 'rgba(255, 107, 107, 0)');
            ctx.fillStyle = nucleusGradient;
            ctx.fillRect(centerX - glowR, centerY - glowR, glowR * 2, glowR * 2);

            // === 逐颗画出质子与中子 ===
            // 红=质子、灰=中子，按六方紧密堆积填成一颗密实的核。
            // 每颗加一道极细的暗色描边 —— 否则相邻同色核子会连成一片，看不出"一颗一颗"；
            // 描边粗细与核子半径成比例（小核的核子被放大后，0.8px 描边会显得过细）
            const nuR = nucBuild.nucleonR;
            const nuStroke = Math.max(0.8, nuR * 0.14);
            nucBuild.nucleons.forEach(nu => {
                ctx.beginPath();
                ctx.arc(centerX + nu.x, centerY + nu.y, nuR, 0, Math.PI * 2);
                ctx.fillStyle = nu.type === 'p' ? NUCLEON_P_COLOR : NUCLEON_N_COLOR;
                ctx.fill();
                ctx.strokeStyle = 'rgba(12, 14, 28, 0.5)';
                ctx.lineWidth = nuStroke;
                ctx.stroke();
            });

            // 绘制电子层轨道
            element.electrons.forEach((count, shellIndex) => {
                const radius = shellRadius(shellIndex, element.electrons.length, shellBase);

                // 绘制轨道（虚线）
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // 标注电子层名称
                // 层间距充足（≤4 层，间距 50px）→ 沿用原布局：统一贴在右缘同一水平线上
                // 层数多、半径被压缩（金：间距 28px）→ 6 个层名会在右缘挤成一串
                //   → 改为按 −70°~+70° 扇形角错开，每个层名各自落位
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = '12px Arial';
                const shellName = SHELL_NAMES[shellIndex] || `${shellIndex + 1}层`;
                const shellCount = element.electrons.length;
                const gap = shellCount > 1
                    ? shellRadius(1, shellCount, shellBase) - shellRadius(0, shellCount, shellBase)
                    : 0;
                if (shellCount > 1 && gap < 34) {
                    const ang = (-70 + (shellIndex * 140) / (shellCount - 1)) * Math.PI / 180;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(
                        shellName,
                        centerX + Math.cos(ang) * (radius + 12),
                        centerY + Math.sin(ang) * (radius + 12)
                    );
                } else {
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(shellName, centerX + radius + 10, centerY - 5);
                }
            });

            // 绘制电子
            const shellCount = element.electrons.length;
            electronAngles.forEach(e => {
                e.angle += e.speed; // 电子运动

                const radius = shellRadius(e.shell, shellCount, shellBase);
                const x = centerX + Math.cos(e.angle) * radius;
                const y = centerY + Math.sin(e.angle) * radius;

                // 电子光晕
                const electronGradient = ctx.createRadialGradient(x, y, 0, x, y, 12);
                electronGradient.addColorStop(0, 'rgba(78, 205, 196, 0.6)');
                electronGradient.addColorStop(1, 'rgba(78, 205, 196, 0)');
                ctx.fillStyle = electronGradient;
                ctx.fillRect(x - 12, y - 12, 24, 24);

                // 电子本体
                ctx.fillStyle = '#4ECDC4';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();

                // 电子边框
                ctx.strokeStyle = '#45B7AA';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 绘制电子电荷
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('-', x, y);
            });

            // 绘制元素符号
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(element.symbol, centerX, canvas.height - 40);
        }

        // 切换元素
        function changeElement() {
            currentElement = document.getElementById('element').value;
            initElectrons();
            hideNucleusTip();     // 切元素时清掉可能还挂着的悬浮提示
            tipSymbol = null;    // 下一元素需重建提示内容

            const element = elements[currentElement];
            const electronConfig = element.electrons.join(', ');
            const totalElectrons = element.electrons.reduce((a, b) => a + b, 0);
            const massNumber = element.protons + element.neutrons;   // 质量数 = 质子数 + 中子数

            document.getElementById('info').innerHTML = `
                <strong>${element.name} (${element.symbol})</strong><br>
                原子序数: ${element.protons}<br>
                电子排布: <span class="electron-config">${electronConfig}</span><br>
                原子核: ${element.protons}个质子（带${element.protons}个单位正电荷）<br>
                中子: ${element.neutrons}个（不带电）<br>
                核外电子: ${totalElectrons}个电子（带${totalElectrons}个单位负电荷）<br>
                质量数: ${massNumber}（质子数 + 中子数）
            `;

            // 核内微粒说明：所有元素都已展开核内结构，本块常显
            document.getElementById('nucleonText').innerHTML =
                `本模型按最常见核素 <sup>${massNumber}</sup>${element.symbol} 绘制：` +
                `${element.protons} 个质子 + ${element.neutrons} 个中子 = ${massNumber} 个核子。`;
        }

        // === 原子核悬浮提示：显示核内质子数 / 中子数 ===
        // 核内结构展开后能"看到"197 颗核子，但数不出精确数量——
        // 悬浮即给出数字，视觉与数值互补。
        const tip = document.getElementById('nucleusTip');
        const HOVER_PAD = 6;          // 命中余量：核边缘多放 6px，投影时不要求精准点中
        let tipSymbol = null;         // 缓存：只在元素变化时重建 HTML，避免 mousemove 每帧重排

        function hideNucleusTip() {
            tip.classList.remove('on');
            canvas.style.cursor = 'default';
        }

        function onCanvasMove(ev) {
            const element = elements[currentElement];
            const nucBuild = getNucleus(element);
            if (!nucBuild) { hideNucleusTip(); return; }

            // 屏幕坐标 → 画布坐标
            // 两个坑要一起绕开：① 画布有 3px 边框，rect 把边框也算进去了；
            // ② 浏览器页面缩放时 clientWidth 不变、rect 会变，不能直接相减求边框。
            // 解法：用「rect 宽 ÷ (内容宽 + 2×边框)」反推缩放系数 k，边框偏移与内容宽都乘 k。
            const rect = canvas.getBoundingClientRect();
            const bwCss = parseFloat(getComputedStyle(canvas).borderLeftWidth) || 0;
            const k = rect.width / (canvas.clientWidth + bwCss * 2);
            const cw = canvas.clientWidth * k;      // 渲染后的内容区宽
            const ch = canvas.clientHeight * k;
            const x = (ev.clientX - rect.left - bwCss * k) * (canvas.width / cw);
            const y = (ev.clientY - rect.top - bwCss * k) * (canvas.height / ch);
            const inNucleus = Math.hypot(x - centerX, y - centerY) <= nucBuild.radius + HOVER_PAD;

            if (!inNucleus) { hideNucleusTip(); return; }

            if (tipSymbol !== element.symbol) {
                const massNumber = element.protons + element.neutrons;
                tip.innerHTML = `
                    <div class="t-title">${element.name} (${element.symbol}) 原子核</div>
                    <div><i class="p"></i>质子：<span class="t-num">${element.protons}</span> 个</div>
                    <div><i class="n"></i>中子：<span class="t-num">${element.neutrons}</span> 个</div>
                    <div class="t-sub">核内共 ${massNumber} 个核子 · 最常见核素 <sup>${massNumber}</sup>${element.symbol}</div>
                `;
                tipSymbol = element.symbol;
            }

            tip.classList.add('on');
            canvas.style.cursor = 'help';

            // 跟随光标。偏移量至少要让开原子核本身 —— 否则提示框正好糊在被悬浮的核上，
            // 挡住了"要看的东西"。核渲染半径按当前缩放换算成屏幕像素。
            const off = Math.max(16, (nucBuild.radius + 12) * (cw / canvas.width));
            const tw = tip.offsetWidth, th = tip.offsetHeight;
            let tx = ev.clientX + off, ty = ev.clientY + off;
            // 贴近窗口右/下边缘时翻到另一侧，避免提示被裁掉
            if (tx + tw > window.innerWidth - 8) tx = ev.clientX - tw - off;
            if (ty + th > window.innerHeight - 8) ty = ev.clientY - th - off;
            tip.style.left = tx + 'px';
            tip.style.top = ty + 'px';
        }

        canvas.addEventListener('mousemove', onCanvasMove);
        canvas.addEventListener('mouseleave', hideNucleusTip);

        // 动画循环
        function animate() {
            drawAtom();
            time++;
            requestAnimationFrame(animate);
        }

        // 支持用 URL 指定打开时显示的元素 —— 供 α 散射页「点击金核」跳转过来直接落在金原子上
        //   写法：atomic_model.html?element=Au（也兼容 hash 写法 #Au）
        (function applyUrlElement() {
            const m = location.search.match(/[?&]element=([A-Za-z]{1,2})\b/)
                   || location.hash.match(/^#([A-Za-z]{1,2})$/);
            if (!m) return;
            // 归一化大小写：au / AU / Au → Au
            const sym = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
            if (elements[sym]) document.getElementById('element').value = sym;
        })();

        initElectrons();
        changeElement(); // 初始化信息面板（读取下拉框当前值，可能是 URL 指定的元素）
        animate();
    </script>
</body>
</html>
